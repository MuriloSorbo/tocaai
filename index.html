<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>toca aí</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23151413'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23E4572E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button class="logo" id="logo" aria-label="Início"><span class="logo-disc"></span>toca aí</button>
  <div class="vol">
    <button class="icon-btn" id="muteBtn" aria-label="Som">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path class="x" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <input type="range" id="vol" min="0" max="1" step="0.05" aria-label="Volume">
  </div>
</header>

<div class="roombar" id="roombar" hidden><i></i><span></span><button>sair da sala</button></div>
<main>
  <section id="home" class="screen active">
    <div class="hero">
      <h1>Adivinha<br>a música.</h1>
      <p id="heroSub"></p>
    </div>
    <div class="grid" id="catGrid"></div>
    <p class="foot">Trechos de 30 segundos via Deezer · letras via LRCLIB</p>
  </section>

  <section id="game" class="screen"><div id="ytdock"><div id="ytplayer"></div></div><div id="gview"></div></section>
  <section id="lobby" class="screen"></section>
  <section id="end" class="screen"></section>
</main>

<div class="sheet-wrap" id="setup" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <div class="sheet-head">
      <h2 id="setupTitle">Rock Nacional</h2>
      <button class="icon-btn" id="setupClose" aria-label="Fechar">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sheet-body">
      <div class="field"><label>Categorias</label><div class="chips" id="catChips"></div></div>
      <div class="field"><label>O que adivinhar</label><div class="seg" data-key="mode">
        <button data-v="titulo">Música</button><button data-v="artista">Artista</button><button data-v="misto">Misturado</button><button data-v="letra">Completar letra</button>
      </div></div>
      <div class="field"><label>Jogadores</label><div class="seg" data-key="players">
        <button data-v="solo">Solo</button><button data-v="coop">Cooperativo</button><button data-v="versus">Competitivo</button>
      </div>
      <p class="hint" id="playersHint"></p></div>
      <div class="field" id="whereField"><label>Onde</label><div class="seg" data-key="where">
        <button data-v="local">Mesmo aparelho</button><button data-v="online">Online, cada um no seu</button>
      </div>
      <div class="names" id="names">
        <input id="name0" maxlength="14" placeholder="Jogador 1" autocomplete="off">
        <input id="name1" maxlength="14" placeholder="Jogador 2" autocomplete="off">
      </div></div>
      <div class="field" id="inputField"><label>Responder</label><div class="seg" data-key="input">
        <button data-v="opcoes">Alternativas</button><button data-v="digitar">Digitando</button><button data-v="cantar">Cantando</button>
      </div></div>
      <div class="row2">
        <div class="field"><label>Músicas</label><div class="seg" data-key="pool">
          <button data-v="classicas">Só as clássicas</button><button data-v="todas">Todas</button>
        </div></div>
        <div class="field"><label>Rodadas</label><div class="seg" data-key="rounds">
          <button data-v="10">10</button><button data-v="15">15</button><button data-v="20">20</button><button data-v="30">30</button>
        </div></div>
      </div>
      <div class="field"><label>Tempo por rodada</label><div class="seg" data-key="time">
        <button data-v="10">10s</button><button data-v="15">15s</button><button data-v="20">20s</button><button data-v="30">30s</button>
      </div></div>
    </div>
    <div class="sheet-foot">
      <span class="pool-count" id="poolCount"></span>
      <button class="btn primary" id="startBtn">Começar</button>
    </div>
  </div>
</div>

<script src="vendor/mqtt.min.js"></script>
<script src="data/songs.js"></script>
<script src="app.js"></script>
</body>
</html>
